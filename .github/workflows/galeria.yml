name: Actualizar galería

on:
  push:
    branches: [main]
    paths:
      - "galeria/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generar galeria.json
        run: python3 .github/scripts/make_manifest.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add galeria/galeria.json
          git diff --staged --quiet || (git commit -m "Actualizar galería" && git push)
